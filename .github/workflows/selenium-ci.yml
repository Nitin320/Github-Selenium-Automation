# ============================================================
# GitHub Actions CI Pipeline — GitHub Selenium Automation
# Author: Nitheesh Prakash
# Role: CI/CD Execution
#
# This workflow runs the full BDD Cucumber + Selenium test suite
# against the live GitHub.com website using headless Chrome on
# an ubuntu-latest runner.
# ============================================================

name: Selenium CI

on:
  # Trigger on every push to master
  push:
    branches: [ master ]

  # Trigger on pull requests targeting master
  pull_request:
    branches: [ master ]

  # Manual trigger — allows any team member to kick off a run
  # from the GitHub Actions tab without a push or PR
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run browser in headless mode'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  selenium-test:
    name: Run Selenium BDD Tests
    runs-on: ubuntu-latest
    # Allow the job to keep uploading artifacts even if tests fail
    # so that screenshots and reports are always available for review
    timeout-minutes: 30

    steps:
      # ── 1. Check out the repository ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 (Temurin / Eclipse Adoptium) ───────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Cache Maven local repository to speed up subsequent runs ───────
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      # ── 4. Install Google Chrome (stable) ────────────────────────────────
      #    ubuntu-latest ships Chrome, but we pin to a known-good version
      #    and print it for traceability in the CI log.
      - name: Install Chrome
        run: |
          google-chrome --version || (
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add - &&
            echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list &&
            sudo apt-get update -q &&
            sudo apt-get install -y google-chrome-stable
          )
          echo "Chrome version: $(google-chrome --version)"

      # ── 5. Run tests (headless Chrome via WebDriverManager) ───────────────
      #    GITHUB_USERNAME and GITHUB_PASSWORD are stored as GitHub Secrets.
      #    They are passed as environment variables and resolved by ConfigReader
      #    through the ${GITHUB_USERNAME} / ${GITHUB_PASSWORD} placeholders in
      #    config.properties.
      #
      #    -Dheadless=true   → picked up by ConfigReader system-property check
      #    --no-transfer-progress → cleaner logs (no per-byte download noise)
      - name: Run Selenium BDD Tests (headless)
        env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_PASSWORD: ${{ secrets.GITHUB_PASSWORD }}
          DISPLAY: :99
        run: |
          # Start a virtual display for any non-headless fallback paths
          Xvfb :99 -screen 0 1920x1080x24 &
          mvn test \
            --no-transfer-progress \
            -Dheadless=${{ github.event.inputs.headless || 'true' }} \
            -Dbrowser=chrome

      # ── 6. Print test summary to CI log ───────────────────────────────────
      - name: Print test summary
        if: always()
        run: |
          echo "============================================"
          echo " TEST EXECUTION SUMMARY"
          echo "============================================"
          if [ -f target/cucumber-reports/cucumber.json ]; then
            echo "Cucumber JSON report found."
            python3 -c "
          import json, sys
          with open('target/cucumber-reports/cucumber.json') as f:
              data = json.load(f)
          total = passed = failed = skipped = 0
          for feature in data:
              for scenario in feature.get('elements', []):
                  total += 1
                  statuses = [s['result']['status'] for s in scenario.get('steps', [])]
                  if 'failed' in statuses:
                      failed += 1
                  elif 'skipped' in statuses:
                      skipped += 1
                  else:
                      passed += 1
          print(f'Scenarios: {total} total | {passed} passed | {failed} failed | {skipped} skipped')
          if failed > 0:
              sys.exit(1)
          " || true
          else
            echo "No Cucumber JSON report found (tests may not have run)."
          fi
          echo "============================================"

      # ── 7. Upload Cucumber HTML report ────────────────────────────────────
      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ github.run_number }}
          path: target/cucumber-reports/
          if-no-files-found: warn
          retention-days: 30

      # ── 8. Upload ExtentReports HTML ──────────────────────────────────────
      - name: Upload ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ github.run_number }}
          path: target/extent-reports/
          if-no-files-found: warn
          retention-days: 30

      # ── 9. Upload Allure results (raw JSON for allure serve) ──────────────
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_number }}
          path: target/allure-results/
          if-no-files-found: warn
          retention-days: 30

      # ── 10. Upload failure screenshots ────────────────────────────────────
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: target/screenshots/
          if-no-files-found: warn
          retention-days: 30

      # ── 11. Upload full Surefire logs ─────────────────────────────────────
      - name: Upload Surefire logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
