# ============================================================
# JUnit Platform Configuration
# Author: Nitheesh Prakash
# Role: CI/CD Execution
# ============================================================
#
# IMPORTANT: Cucumber-specific settings (cucumber.features, cucumber.glue,
# cucumber.plugin, cucumber.execution.parallel.*) intentionally do NOT live
# in this file. This file is loaded for EVERY JUnit Platform launch —
# including when you run a single plain JUnit 5 class like LoginTest,
# ProfileTest, or LogoutTest in the IDE.
#
# Putting cucumber.features here caused the Cucumber engine to ignore the
# specific class you selected and always re-run ALL scenarios in every
# feature file. That bug is fixed by keeping Cucumber config exclusively
# inside runners/TestSuiteRunner.java via @ConfigurationParameter, so it
# only activates when TestSuiteRunner is the entry point.
#
# ─── What lives here ────────────────────────────────────────────────────────
# Only the JUnit Jupiter (plain @Test) parallel-execution settings live here.
# These affect LoginTest, ProfileTest, LogoutTest, etc. when they are run
# individually — either from the IDE or via:
#   mvn test -Dtest=LoginTest,ProfileTest,LogoutTest
# ────────────────────────────────────────────────────────────────────────────

# ── Parallel execution (JUnit 5 plain @Test classes) ────────────────────────
#
# enabled=true     → the JUnit Platform will run tests in parallel
# mode.default=same_thread    → methods within the same test class share
#                               one thread, so @BeforeEach/@AfterEach and
#                               the ThreadLocal<WebDriver> in DriverManager
#                               always see a consistent driver instance.
# mode.classes.default=concurrent → different test CLASSES run concurrently
#                               (each class gets its own thread → its own
#                               WebDriver instance via ThreadLocal).
#
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# ── Thread pool configuration ────────────────────────────────────────────────
#
# strategy=fixed   → use a fixed number of threads
# parallelism=2    → 2 threads (safe for the current number of test classes;
#                    increase to 4 once all teammates' page objects are complete
#                    and confirmed thread-safe)
#
# NOTE: Cucumber parallel execution is configured separately in
#       TestSuiteRunner.java (fixed parallelism = 2) to keep the two
#       execution modes independently controllable.
#
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=2
