# ============================================================
# GitHub Selenium Automation — Configuration
# Author: Arsath
# ============================================================

# Base URL
base.url=https://github.com

# GitHub credentials — supplied via environment variables at runtime
# NEVER hardcode credentials here; set GITHUB_USERNAME / GITHUB_PASSWORD
# as OS-level or CI/CD environment variables before execution.
github.username=${GITHUB_USERNAME}
github.password=${GITHUB_PASSWORD}

# Browser configuration
browser=chrome
headless=false

# Test data — must be a repo owned by the test account (Issues enabled, you have write access)
# Confirmed from dashboard screenshot: Group5ProjectIBM/test-automation-repo exists
test.repo=test-automation-repo

# Timeouts (seconds)
implicit.wait=5
explicit.wait=15
page.load.timeout=30
# Excel test data file path
testdata.file=src/test/resources/testdata/github_testdata.xlsx
testdata.sheet=LoginData

# ── Autonomous AI Engine ──────────────────────────────────────────────────────
# Output directory for AI-generated HTML + JSON reports
ai.reports.dir=target/ai-reports

# Explorer depth: how many link-hops the crawler follows from the start page.
# 0 = only the start page is analysed.  Increase carefully on large accounts.
explorer.max.depth=2

# Explorer page cap: stops crawling after this many unique pages are visited.
explorer.max.pages=30

# Number of other-user repos to spot-check when found on Explore/Trending pages.
# Set to 0 to disable repo sampling entirely.
explorer.sample.repos=2

# ── Adaptive Wait Engine ──────────────────────────────────────────────────────
# These values are used as DEFAULTS for first-time locators only.
# After a locator is seen once, AdaptiveWait calibrates its own timeout
# automatically based on observed response times — you do not need to tune these.
# explicit.wait is already defined above; the adaptive engine reads it.



