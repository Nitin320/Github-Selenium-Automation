# JUnit Platform configuration
# Author: Nitheesh
#
# IMPORTANT: Cucumber-specific settings (cucumber.features, cucumber.glue,
# cucumber.plugin, naming-strategy) intentionally do NOT live in this file
# anymore. This file is loaded for EVERY JUnit Platform launch — including
# when you run a single plain JUnit 5 class like LoginTest, LogoutTest, or
# ProfileTest. Declaring cucumber.features here made the Cucumber engine
# ignore whichever class you actually selected and always re-run every
# scenario in login.feature instead.
#
# Cucumber config now lives exclusively in runners/TestSuiteRunner.java
# via @ConfigurationParameter, so it only applies when that specific
# Suite class is executed.
