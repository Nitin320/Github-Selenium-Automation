# ============================================================
# GitHub Selenium Automation — CI Configuration
# Environment: ci (GitHub Actions runner)
# Author: Group 5
#
# Usage: mvn test -Denv=ci  (or used automatically via CI profiles)
#
# In CI, credentials come from GitHub Secrets:
#   GITHUB_USERNAME and GITHUB_PASSWORD are set as environment variables
#   by the CI workflow and resolved here via the ${} placeholder mechanism.
# ============================================================

base.url=https://github.com
github.username=${GITHUB_USERNAME}
github.password=${GITHUB_PASSWORD}

browser=chrome
headless=true

test.repo=test-automation-repo

implicit.wait=5
explicit.wait=30
page.load.timeout=60
testdata.file=src/test/resources/testdata/github_testdata.xlsx
testdata.sheet=LoginData

ai.reports.dir=target/ai-reports

# ── Autonomous Explorer — CI deep crawl settings ─────────────────────────────
# Depth 3 means: start page → level-1 pages → level-2 pages → level-3 pages
# Acceptable in CI (60-min regression window); keep at 1-2 locally.
explorer.max.depth=3
# Hard page cap: stops after 50 unique URLs regardless of depth
explorer.max.pages=50
# Sample up to 3 other-user repos spotted on Explore / Trending
explorer.sample.repos=3
