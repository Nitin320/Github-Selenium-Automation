# Allure reporting configuration
# Author: Sulthan
# Allure configuration — Group 5 GitHub Selenium Automation
# Results written here by allure-junit5 at runtime; mvn allure:report reads them back.
allure.results.directory=target/allure-results

# Link patterns — links @Issue / @TfsLink annotations in tests to real trackers
allure.link.issue.pattern=https://github.com/Group5ProjectIBM/test-automation-repo/issues/{}
allure.link.tms.pattern=https://alm.ibm.com/ibm-internal/trainingId/{}

# Suite-level labels shown in the Allure dashboard
allure.label.epic=GitHub Automation
allure.label.framework=Selenium 4 + JUnit 5
allure.label.language=Java 21
