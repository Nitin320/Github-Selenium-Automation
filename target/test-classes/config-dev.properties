# ============================================================
# GitHub Selenium Automation — Local Development Configuration
# Environment: dev (local machine)
# Author: Group 5
#
# Usage: mvn test -Denv=dev
#        (ConfigReader reads config-dev.properties when env=dev)
#
# DO NOT commit credentials — use GITHUB_USERNAME / GITHUB_PASSWORD
# environment variables or a local .env file.
# ============================================================

base.url=https://github.com
github.username=${GITHUB_USERNAME}
github.password=${GITHUB_PASSWORD}

browser=chrome
headless=false

test.repo=test-automation-repo

implicit.wait=5
explicit.wait=20
page.load.timeout=45
testdata.file=src/test/resources/testdata/github_testdata.xlsx
testdata.sheet=LoginData

ai.reports.dir=target/ai-reports
explorer.max.depth=1
explorer.max.pages=10
explorer.sample.repos=1
